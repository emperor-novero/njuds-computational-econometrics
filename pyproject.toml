[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "njuds-computational-econometrics"
version = "1.0.0"
description = "Reference implementation of computational spatial econometrics, municipal equalization modeling (Chapter 123), and multi-modal vision token reduction."
readme = "README.md"
authors = [
    { name = "Dorian Mario Gonzalez", email = "dorianmariogonzalez@gmail.com" },
    { name = "NJUDS Computational Econometrics Research Lab" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Financial and Insurance Industry",
]

[project.urls]
Homepage = "https://github.com/emperor-novero/njuds-computational-econometrics"

[tool.setuptools.packages.find]
where = ["src"]
